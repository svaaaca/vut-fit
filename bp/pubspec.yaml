name: veloo
description: Cycling trip planning application.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  file_picker: ^10.0.0
  firebase_core: ^3.13.0
  fl_chart: ^0.71.0
  flutter:
    sdk: flutter
  flutter_dropzone: ^4.2.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.1.1
  flutter_map_animations: ^0.9.0
  flutter_map_cancellable_tile_provider: ^3.1.0
  geolocator: ^14.0.0
  http: ^1.3.0
  input_quantity: ^2.5.1
  intl: ^0.19.0
  language_picker: ^0.4.5
  latlong2: ^0.9.1
  path: ^1.9.1
  permission_handler: ^12.0.0+1
  permission_handler_apple: ^9.4.7
  provider: ^6.1.4
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
